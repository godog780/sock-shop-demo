apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  labels:
    name: orders-db
  namespace: sock-shop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: orders-db
  template:
    metadata:
      labels:
        name: orders-db
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: orders-db
          image: quay.io/mongodb/mongodb:org-4.4-standalone-ubuntu2204
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: 27017
          securityContext:
            runAsUser: 999
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /data/db
              name: orders-db-vol
            - mountPath: /tmp
              name: orders-db-temp-vol
      volumes:
        - name: orders-db-vol
          persistentVolumeClaim:
            claimName: orders-db-temp-pvc
        - name: orders-db-temp-vol
          emptyDir: {}
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        kubernetes.io/arch: amd64
